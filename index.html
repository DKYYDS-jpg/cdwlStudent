<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 网站入口页：GitHub Pages 等静态托管要求根目录存在 index.html，
         访问仓库根地址时由此页面接管，立即跳转到「蜀韵成都」首页 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 元刷新：页面加载后 0 秒跳转到网站首页 -->
    <meta http-equiv="refresh" content="0; url=shuyun-chengdu/index.html">
    <title>蜀韵成都</title>
    <style>
        /* 跳转前短暂显示的过渡样式（与网站金色主题呼应） */
        body { font-family: "Microsoft YaHei", sans-serif; background: #faf7f0; color: #a67c00; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <!-- 跳转提示（正常情况下用户几乎看不到） -->
    <p>正在进入「蜀韵成都」… <a href="shuyun-chengdu/index.html">如未自动跳转，请点击这里</a></p>
    <!-- 脚本立即跳转，作为元刷新的兜底方案 -->
    <script>location.replace('shuyun-chengdu/index.html');</script>
</body>
</html>
